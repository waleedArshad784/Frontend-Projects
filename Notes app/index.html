    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notes App</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family:'Poppins',sans-serif;
        }
    </style>

</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-100 via-white to-pink-100 flex justify-center items-center p-8">


    <!-- Main Container -->

    <div class="w-full max-w-4xl bg-white rounded-3xl shadow-2xl p-10">

        <!-- ================= HEADER ================= -->

        <header class="text-center mb-10">

            <div class="text-6xl mb-4">
                📝
            </div>

            <h1 class="text-4xl font-bold text-slate-800">
                My Notes
            </h1>

            <p class="text-slate-500 mt-2">
                Save your thoughts beautifully.
            </p>

        </header>

        <!-- ================= FORM ================= -->

        <section class="space-y-6">

            <!-- Title -->

            <div>

                <label
                    for="title"
                    class="block text-slate-700 font-medium mb-2">

                    Note Title

                </label>

                <input
                    id="title"
                    type="text"
                    placeholder="Enter note title..."
                    class="w-full rounded-xl border border-gray-300 px-5 py-3 outline-none focus:ring-2 focus:ring-indigo-400">

            </div>

            <!-- Description -->

            <div>

                <label
                    for="description"
                    class="block text-slate-700 font-medium mb-2">

                    Description

                </label>

                <textarea
                    id="description"
                    rows="6"
                    placeholder="Write your note here..."
                    class="w-full rounded-xl border border-gray-300 px-5 py-3 resize-none outline-none focus:ring-2 focus:ring-indigo-400"></textarea>

            </div>

            <!-- Button -->

            <div class="flex justify-center">

                <button
                    id="addBtn"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-10 py-3 rounded-xl transition duration-300 shadow-lg">

                    + Add Note

                </button>

            </div>

        </section>

        <!-- ================= NOTES ================= -->

        <section class="mt-12">

            <h2 class="text-2xl font-semibold text-slate-800 mb-6">

                Your Notes

            </h2>

            <!-- JavaScript will insert cards here -->

            <div
                id="notesContainer"
                class="space-y-5">

            </div>

        </section>
        <!-- ================= NOTES SECTION ================= -->


    <!-- Empty State (Hide this when notes exist) -->

    <div id="emptyState"
        class="hidden bg-slate-50 rounded-2xl border-2 border-dashed border-slate-300 p-10 text-center">

        <div class="text-6xl mb-4">
            📒
        </div>

        <h3 class="text-xl font-semibold text-slate-700">
            No Notes Yet
        </h3>

        <p class="text-slate-500 mt-2">
            Click "Add Note" to create your first note.
        </p>

    </div>

    <!-- Notes Container -->

  

</section>

<!-- ================= FOOTER ================= -->

<footer class="mt-12 pt-6 border-t border-slate-200 text-center">

    <p class="text-slate-500">

        Made with Muhammad Waleed using HTML • Tailwind CSS • JavaScript

    </p>

</footer>

    </div>

    

</body>
</html>

    
    <script src="script.js"></script>
</body>
</html>
